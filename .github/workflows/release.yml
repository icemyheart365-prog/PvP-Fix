name: Build and Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build datapack ZIP
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ZIP_NAME="PvP-Fix-1.21.11-datapack-v${VERSION}.zip"

          cd datapack
          zip -r "../${ZIP_NAME}" .
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Read tag and commit information
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG_NOTES="$(git tag -l --format='%(contents)' "$VERSION")"
          COMMIT_SUBJECT="$(git show -s --format='%s' "$COMMIT_SHA")"
          COMMIT_BODY="$(git show -s --format='%b' "$COMMIT_SHA")"

          if [ -z "$TAG_NOTES" ]; then
            echo "::error::The tag does not contain an annotated tag message."
            exit 1
          fi

          {
            echo "NOTES<<EOF"
            echo "$TAG_NOTES"
            echo
            echo "---"
            echo
            echo "### Commit"
            echo
            echo "**$COMMIT_SUBJECT**"

            if [ -n "$COMMIT_BODY" ]; then
              echo
              echo "$COMMIT_BODY"
            fi

            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
          NOTES: ${{ env.NOTES }}
        run: |
          gh release create "$VERSION" \
            "$ZIP_NAME" \
            --title "PvP-Fix ${VERSION}" \
            --notes "$NOTES" \
            --prerelease
